services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: clora_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DATABASE_URL=sqlite:///./storage/indusai.db
      - STORAGE_DIR=./storage
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set in environment}
      - MAX_FILE_SIZE_MB=50
      - SYNC_QUERY_TIMEOUT_SEC=15
      - AIRGAP_STRICT_MODE=strict
    volumes:
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clora_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
