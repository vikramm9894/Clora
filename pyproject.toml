[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indusai-x"
version = "1.0.0"
description = "Sovereign On-Premise Agentic AI Workbench for MRPL (SIH Problem Statement 26117)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.0",
    "langchain-core>=1.6.0",
    "chromadb>=1.5.0",
    "sentence-transformers>=5.0.0",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.28",
    "aiofiles>=23.2.1",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "duckdb>=1.0.0",
    "sqlglot>=20.0.0",
    "networkx>=3.0.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "reportlab>=4.0.0",
    "sse-starlette>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langchain-ollama>=1.1.0",
    "rich>=13.0.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["backend*", "security*", "indusai*", "data_intelligence*", "app*"]
exclude = ["tests*", "frontend*", "storage*", "LLM*", "samples*"]

